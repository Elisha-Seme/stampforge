<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}StampForge{% endblock %} — StampForge</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
        crossorigin="anonymous" referrerpolicy="no-referrer"/>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-mark">
      <i class="fa-solid fa-stamp"></i>
    </div>
    <span class="logo-text">StampForge</span>
  </div>

  <nav class="sidebar-nav">
    <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
      <i class="fa-solid fa-gauge-high"></i><span>Dashboard</span>
    </a>
    <a href="/staff" class="nav-item {% if request.path.startswith('/staff') %}active{% endif %}">
      <i class="fa-solid fa-users"></i><span>Staff</span>
    </a>
    <a href="/generate" class="nav-item {% if request.path == '/generate' %}active{% endif %}">
      <i class="fa-solid fa-wand-magic-sparkles"></i><span>Generate Stamps</span>
    </a>
    <a href="/stamp-pdf" class="nav-item {% if request.path == '/stamp-pdf' %}active{% endif %}">
      <i class="fa-solid fa-file-pdf"></i><span>Stamp PDFs</span>
    </a>
    <a href="/e-signatures" class="nav-item {% if request.path == '/e-signatures' %}active{% endif %}">
      <i class="fa-solid fa-pen-fancy"></i><span>E-Signatures</span>
    </a>
    <a href="/audit-log" class="nav-item {% if request.path == '/audit-log' %}active{% endif %}">
      <i class="fa-solid fa-clock-rotate-left"></i><span>Audit Log</span>
    </a>
    <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
      <i class="fa-solid fa-gear"></i><span>Settings</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="org-name">{{ org.name if org else 'StampForge' }}</div>
    <div class="sidebar-version">v1.0.0</div>
  </div>
</aside>

<!-- ===================== MAIN ===================== -->
<div class="main-wrapper">
  <header class="topbar">
    <button class="topbar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="topbar-title">{% block page_title %}{% endblock %}</div>
    <div class="topbar-actions">{% block topbar_actions %}{% endblock %}</div>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>
</div>

<!-- ===================== TOAST CONTAINER ===================== -->
<div id="toastContainer" class="toast-container" aria-live="polite"></div>

<!-- ===================== MODAL OVERLAY ===================== -->
<div id="modalOverlay" class="modal-overlay hidden">
  <div class="modal-box" id="modalBox">
    <button class="modal-close" id="modalClose" aria-label="Close modal">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="/static/js/app.js"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
